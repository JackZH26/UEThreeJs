# 最小示例：两个房间用一道门串起来。
# 用途：Phase 0 的验收样本 + CI 冒烟测试。
schemaVersion: 0.1.0

meta:
  name: Two Rooms
  units: meters
  grid: 0.5
  wallThickness: 0.2
  entryRoom: entry
  description: |
    验证最小闭环：房间外壳、一个可通行开口、一条连接、一个出生点。

themes:
  - id: concrete
    name: Concrete
    surfaces:
      floor: concrete_floor
      ceiling: concrete_ceiling
      wall: concrete_wall
      structure: painted_steel
    lightPreset: warehouse_dim

rooms:
  - id: entry
    name: Entry
    size: { w: 8, d: 8, h: 4 }
    theme: concrete
    doorCount: 1
    openings:
      - id: door_north
        wall: north
        type: door
        offset: 0
        size: { w: 1.6, h: 2.4 }
    markers:
      - id: spawn_player
        kind: spawn
        at: { x: 0, y: 0, z: 2 }
        rotationY: 180

  - id: store
    name: Store Room
    size: { w: 6, d: 6, h: 4 }
    theme: concrete
    doorCount: 1
    openings:
      - id: door_south
        wall: south
        type: door
        offset: 0
        size: { w: 1.6, h: 2.4 }

connections:
  - id: entry_to_store
    from: entry.door_north
    to: store.door_south
