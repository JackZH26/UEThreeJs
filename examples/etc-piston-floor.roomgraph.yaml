# ENTER THE CUBE 的房间样例：#8 Piston Floor（活塞地板）
#
# 这个文件演示**正确的关卡模型**：一个关卡 = 一个独立的立方体房间。
# 游戏里 36 个房间是可互换的独立单元，每局按 seed 随机拼装 ——
# 房间之间没有固定连接，因此本文档**不含 connections**。
#
# 四面墙各开一个传送门，去向由运行时的生成器决定，关卡作者不指定。
schemaVersion: 0.1.0

meta:
  name: 'ETC #8 Piston Floor'
  units: meters
  grid: 0.5
  wallThickness: 0.4
  entryRoom: piston_floor
  description: |
    活塞地板：柱体升降，玩家需在柱阵间穿行躲避。
    危险等级：Damage。四面墙各一个传送门，玩家从任意一面进入。

    房间尺寸取 16×16×8 —— 可互换单元应保持统一外形，
    这样生成器才能把任意房间放到立方体的任意格位。

themes:
  - id: industrial
    name: Industrial Steel
    surfaces:
      floor: steel_plate_floor
      ceiling: steel_deck
      wall: riveted_steel_wall
      structure: warning_yellow_steel
    lightPreset: industrial_spot
    ambientColor: '#22262b'

rooms:
  - id: piston_floor
    name: Piston Floor
    size: { w: 16, d: 16, h: 8 }
    theme: industrial
    # 四个传送门都算可通行开口，所以 doorCount = 4
    doorCount: 4
    tags: [hazard, damage]
    userData:
      danger: damage
      hazard: piston_floor
      pistonCycleSeconds: 3.5

    openings:
      - id: portal_north
        wall: north
        type: portal
        offset: 0
        size: { w: 2.4, h: 3 }
      - id: portal_south
        wall: south
        type: portal
        offset: 0
        size: { w: 2.4, h: 3 }
      - id: portal_east
        wall: east
        type: portal
        offset: 0
        size: { w: 2.4, h: 3 }
      - id: portal_west
        wall: west
        type: portal
        offset: 0
        size: { w: 2.4, h: 3 }

    structures:
      # 活塞柱阵：4×4 网格，运行时由 gameplay 驱动升降
      # （静态编辑器里只摆位置与尺寸，动画不属于关卡数据）
      - { id: piston_a1, type: pillar, at: { x: -4.5, z: -4.5 }, size: 1.2, height: 2.5 }
      - { id: piston_a2, type: pillar, at: { x: -1.5, z: -4.5 }, size: 1.2, height: 4 }
      - { id: piston_a3, type: pillar, at: { x: 1.5, z: -4.5 }, size: 1.2, height: 1.5 }
      - { id: piston_a4, type: pillar, at: { x: 4.5, z: -4.5 }, size: 1.2, height: 3 }
      - { id: piston_b1, type: pillar, at: { x: -4.5, z: -1.5 }, size: 1.2, height: 3.5 }
      - { id: piston_b2, type: pillar, at: { x: -1.5, z: -1.5 }, size: 1.2, height: 1.5 }
      - { id: piston_b3, type: pillar, at: { x: 1.5, z: -1.5 }, size: 1.2, height: 4.5 }
      - { id: piston_b4, type: pillar, at: { x: 4.5, z: -1.5 }, size: 1.2, height: 2 }
      - { id: piston_c1, type: pillar, at: { x: -4.5, z: 1.5 }, size: 1.2, height: 2 }
      - { id: piston_c2, type: pillar, at: { x: -1.5, z: 1.5 }, size: 1.2, height: 4 }
      - { id: piston_c3, type: pillar, at: { x: 1.5, z: 1.5 }, size: 1.2, height: 2.5 }
      - { id: piston_c4, type: pillar, at: { x: 4.5, z: 1.5 }, size: 1.2, height: 3.5 }
      - { id: piston_d1, type: pillar, at: { x: -4.5, z: 4.5 }, size: 1.2, height: 3 }
      - { id: piston_d2, type: pillar, at: { x: -1.5, z: 4.5 }, size: 1.2, height: 1.5 }
      - { id: piston_d3, type: pillar, at: { x: 1.5, z: 4.5 }, size: 1.2, height: 4 }
      - { id: piston_d4, type: pillar, at: { x: 4.5, z: 4.5 }, size: 1.2, height: 2.5 }

      # 顶部检修廊桥：给狙击位，也是"高处更危险"的设计
      - id: catwalk_ring
        type: catwalk
        path:
          - { x: -6.5, z: -6.5 }
          - { x: 6.5, z: -6.5 }
          - { x: 6.5, z: 6.5 }
        elevation: 6
        width: 1.2
        railing: both

      - id: corner_platform
        type: platform
        rect: { x: -5, z: 5.5, w: 5, d: 4 }
        elevation: 6
        thickness: 0.3
        railing: [north, east]

      - id: stair_to_catwalk
        type: stair
        from: { x: -6.5, z: -1.5 }
        to: corner_platform
        width: 1.2
        facing: south
        stepHeight: 0.2
        railing: both

    lights:
      - { id: bay_a, type: point, at: { x: -4, y: 7, z: -4 }, range: 12 }
      - { id: bay_b, type: point, at: { x: 4, y: 7, z: 4 }, range: 12 }

    markers:
      - { id: spawn_center, kind: spawn, at: { x: 0, y: 0, z: 0 } }
      - { id: cover_c2, kind: cover, at: { x: -1.5, y: 0, z: 1.5 }, radius: 1.5 }

# 房间之间的连接由运行时生成器决定，关卡文档不含 connections
connections: []
